[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interviewoverfit"
version = "0.1.0"
description = "InterviewOverfit Boss Battle Game Backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.67.0",
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
]

[tool.setuptools]
py-modules = ["app"]
